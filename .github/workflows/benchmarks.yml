name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Memcached 1.6.45
      working-directory: scripts
      env:
        MEMCACHED_VERSION: 1.6.45
      run: |
        chmod +x ./install_memcached.sh
        ./install_memcached.sh
        memcached -d
        memcached -d -p 11222
    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: 4.0
        bundler-cache: true # 'bundle install' and cache
    - name: Run Benchmarks
      run: RUBY_YJIT_ENABLE=1 BENCH_TARGET=all bundle exec bin/benchmark

name: RuboCop

# Pushes to other branches are covered by their pull request's run, so a PR
# branch isn't tested twice
on:
  push:
    branches: [main, '*-stable']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.6
        bundler-cache: true # 'bundle install' and cache
    - name: Run RuboCop
      run: bundle exec rubocop --parallel

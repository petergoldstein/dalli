name: Scorecard

# OpenSSF Scorecard checks the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection and so on). Results go
# to the Security tab and to the public scorecard.dev API.
on:
  push:
    branches: [ main ]
  # Rerun when branch protection changes, since it's one of the checks
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

# publish_results requires read-only permissions at the top level
permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Forks have no use for the results, and can't publish them
    if: github.repository == 'petergoldstein/dalli'
    permissions:
      # Upload the results to the Security tab
      security-events: write
      # Sign the published results
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run analysis
      uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload to code scanning
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: results.sarif
